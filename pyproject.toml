[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "contextvault"
version = "0.1.0"
description = "Offline evidence-first multimodal retrieval and RAG for small document collections"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.141,<0.142",
    "numpy>=2.5,<3",
    "ollama>=0.6,<1",
    "pillow>=12.3,<13",
    "pydantic>=2.13,<3",
    "pymupdf>=1.28,<2",
    "python-multipart>=0.0.22,<1",
    "uvicorn[standard]>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
include = ["contextvault*"]

[tool.setuptools.package-data]
contextvault = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
